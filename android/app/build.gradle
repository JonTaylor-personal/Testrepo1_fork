plugins {
    id 'com.android.application'
}

android {
    namespace 'com.openingcoach.app'
    compileSdk 35

    defaultConfig {
        applicationId 'com.openingcoach.app'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '1.0'
    }

    // A fixed (non-secret) debug key, so new builds install over old ones without uninstalling.
    signingConfigs {
        debug {
            storeFile file('../debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }

    // The web app in /web is bundled as the app's assets.
    sourceSets {
        main {
            assets.srcDirs = ['../../web']
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.12.1'
}
